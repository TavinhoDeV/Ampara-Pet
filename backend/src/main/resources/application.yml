server:
  port: 8080

spring:
  application:
    name: ampara
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ampara}
    username: ${DB_USER:ampara}
    password: ${DB_PASSWORD:ampara}
  jpa:
    hibernate:
      # O schema é gerenciado pelo Flyway. Depois que tudo estiver rodando, troque para "validate".
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

ampara:
  jwt:
    # Em produção, defina JWT_SECRET com no mínimo 32 caracteres.
    secret: ${JWT_SECRET:troque-esta-chave-em-producao-com-no-minimo-32-caracteres}
    expiration-minutes: 480
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin:
    # Usuário administrador criado automaticamente quando o banco está sem usuários.
    email: ${ADMIN_EMAIL:admin@ampara.local}
    senha: ${ADMIN_SENHA:Admin#12345}
